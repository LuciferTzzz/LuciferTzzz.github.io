<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='90' font-size='90'>📚</text></svg>">
<title>唐泽子瞻的资源收集站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    max-width:960px;
    margin:2rem auto;
    padding:0 clamp(0.8rem,3vw,1.2rem);
    font-family:"PingFang SC","Microsoft YaHei","HarmonyOS Sans SC",system-ui,-apple-system,sans-serif;
    font-weight:bold;
    background: url("flowers.png") no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}
#particles{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
}
.welcome{
    text-align:center;
    margin-bottom:clamp(24px,5vw,36px);
}
.welcome h1{
    font-size:clamp(32px,7vw,46px);
    margin-bottom:0;
    font-family:"LiSu","隶书","STLiti","KaiTi","楷体","HarmonyOS Sans SC","PingFang SC",system-ui,sans-serif;
    font-weight:normal;
    color:#1e293b;
}
.card-box{
    border-radius:18px;
    padding:clamp(18px,3vw,24px);
    margin-bottom:clamp(16px,4vw,22px);
    background: linear-gradient(135deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.55) 100%);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border:1px solid rgba(255,255,255,0.85);
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06), inset 0 1px 1px rgba(255,255,255,0.8);
    transition:0.28s ease;
    position:relative;
    overflow:hidden;
    cursor:default;
}
.card-box::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:19px;
    padding:1px;
    background:linear-gradient(135deg,rgba(255,255,255,0.9),rgba(255,255,255,0.25),rgba(255,255,255,0.7));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:0.55;
    pointer-events:none;
}
.card-box::after{
    content:"";
    position:absolute;
    inset:-30%;
    background:radial-gradient(circle at var(--x,0) var(--y,0), rgba(255,255,255,0.22), transparent 42%);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.3s;
}
.card-box:hover::after{
    opacity:1;
}
.card-box:hover{
    transform: translateY(-3px);
    box-shadow:0 14px 32px rgba(15, 23, 42, 0.10), inset 0 1px 1px rgba(255,255,255,0.9);
}
.card-box h2{
    font-size:clamp(20px,4vw,26px);
    color:#1e293b;
    font-family:"LiSu","隶书","STLiti","KaiTi","楷体","HarmonyOS Sans SC","PingFang SC",system-ui,sans-serif;
    font-weight:normal;
}
.card-row{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(clamp(140px,22vw,170px), 1fr));
    gap:clamp(10px,2vw,14px);
}
.card, .card:link{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:clamp(12px,2vw,16px) 8px;
    border-radius:14px;
    background:linear-gradient(135deg,rgba(255,255,255,0.65),rgba(255,255,255,0.42));
    border:1px solid rgba(255,255,255,0.7);
    font-size:clamp(14px,2.8vw,16px);
    color:#1e293b;
    text-decoration:none;
    transition:0.26s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:0 2px 10px rgba(15,23,42,0.05), inset 0 1px 1px rgba(255,255,255,0.75);
    position:relative;
    overflow:hidden;
    cursor:pointer;
}
.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at var(--x,0) var(--y,0), rgba(255,255,255,0.3), transparent 38%);
    pointer-events:none;
    opacity:0;
    transition:opacity 0.28s;
}
.card:hover::before{
    opacity:1;
}
.card:hover{
    transform: translateY(-3px) scale(1.02);
    background:linear-gradient(135deg,rgba(255,255,255,0.75),rgba(255,255,255,0.52));
    box-shadow:0 10px 24px rgba(15,23,42,0.09), inset 0 1px 1px rgba(255,255,255,0.85);
}
.card:active{
    transform: translateY(0px) scale(0.985);
}
.card-box > p{
    margin-top:14px;
    font-size:clamp(13px,2.5vw,15px);
    color:#475569;
}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<main class="container">
    <section class="welcome">
        <h1>唐泽子瞻的资源收集站</h1>
    </section>

    <!-- 板块1：网课学习链接 -->
    <section id="online-course" class="card-box">
        <h2>网课学习链接</h2>
        <div class="card-row" style="margin-top:16px;">
            <div class="card" onclick="window.open('mechanical.html','_blank')">机械专业课程</div>
            <div class="card" onclick="window.open('electric.html','_blank')">电气专业课程</div>
            <div class="card" onclick="window.open('computer.html','_blank')">计算机课程</div>
            <div class="card" onclick="window.open('general.html','_blank')">通用公共课程</div>
            <div class="card" onclick="window.open('other.html','_blank')">其他网课资源</div>
        </div>
    </section>

    <!-- 板块2：网盘链接 -->
    <section id="net-disk" class="card-box">
        <h2>网盘链接</h2>
        <div class="card-row" style="margin-top:16px;">
            <div class="card" onclick="launchClient('baidunetdisk://','https://pan.baidu.com','百度网盘')">百度网盘（本地资源库）</div>
            <div class="card" onclick="launchClient('quark://','https://pan.quark.cn','夸克网盘')">夸克网盘（素材备份）</div>
            <div class="card" onclick="launchWps()">WPS网盘（文档笔记）</div>
        </div>
    </section>

    <!-- 板块3：本地链接 -->
    <section id="local-file" class="card-box">
        <h2>本地链接</h2>
        <div class="card-row" style="margin-top:16px;">
            <a href="网站及密码.docx" class="card">网站及密码.docx</a>
            <div class="card" onclick="copyGithubPath()">github文件夹（复制路径）</div>
        </div>
        <p>注：本地文件仅在电脑本地打开站点时可访问，线上网页无法读取本地文件</p>
    </section>

    <!-- 板块4：本站功能 -->
    <section id="site-func" class="card-box">
        <h2>本站功能</h2>
        <div class="card-row" style="margin-top:16px;">
            <div class="card" onclick="window.open('message.html','_blank')">公开留言板</div>
            <div class="card" onclick="window.open('https://github.com/LuciferTzzz/LuciferTzzz.github.io/issues?q=label%3Amessage-board','_blank')">留言管理后台</div>
        </div>
    </section>

    <!-- 板块5：配置管理 -->
    <section id="config" class="card-box">
        <h2>配置（站点部署相关）</h2>
        <div class="card-row" style="margin-top:16px;">
            <a target="_blank" href="https://github.com" class="card">Github主页</a>
            <a target="_blank" href="https://dash.cloudflare.com/" class="card">Cloudflare控制台</a>
        </div>
    </section>
</main>

<script>
// 判断当前是否为本地文件打开（file://协议）
const isLocalFile = window.location.protocol === "file:";

// 复制github本地文件夹路径
function copyGithubPath(){
    const path = 'D:\\study\\coding\\github';
    navigator.clipboard.writeText(path).then(()=>{
        alert('路径已复制：\n' + path + '\n打开此电脑，地址栏粘贴跳转');
    }).catch(()=>{
        alert('复制失败，路径：\n' + path);
    })
}

/**
 * 通用唤起本地客户端函数
 * @param scheme 协议
 * @param webUrl 网页兜底地址
 * @param name 软件名称
 */
function launchClient(scheme, webUrl, name){
    // 如果本地文件模式，直接弹窗选择（绕过失效的visibility检测）
    if(isLocalFile){
        const select = confirm(`尝试唤起【${name}】客户端\n确认=尝试打开软件\n取消=打开网页版`);
        if(select){
            window.location.href = scheme;
        }else{
            window.open(webUrl,"_blank");
        }
        return;
    }

    // 线上网页（https）使用原有的页面可见性检测方案
    let switched = false;
    const timer = setTimeout(()=>{
        if(!switched){
            const confirmOpen = confirm(`无法唤起${name}客户端，是否打开网页版？`);
            if(confirmOpen){
                window.open(webUrl,"_blank");
            }
        }
        document.removeEventListener("visibilitychange", visibilityHandler);
    },1200);

    function visibilityHandler(){
        if(document.hidden){
            switched = true;
            clearTimeout(timer);
            document.removeEventListener("visibilitychange", visibilityHandler);
        }
    }
    document.addEventListener("visibilitychange", visibilityHandler);
    window.location.href = scheme;
}

/**
 * WPS专属唤起逻辑
 */
function launchWps(){
    const wpsWeb = "https://www.kdocs.cn/space/644295476/311635169";
    if(isLocalFile){
        const select = confirm(`尝试唤起【WPS】客户端\n确认=尝试打开软件\n取消=打开网页版`);
        if(select){
            window.location.href = "wps://";
        }else{
            window.open(wpsWeb,"_blank");
        }
        return;
    }

    let switched = false;
    const timer = setTimeout(()=>{
        if(!switched){
            window.open(wpsWeb,"_blank");
        }
        document.removeEventListener("visibilitychange", visibilityHandlerWps);
    },1200);

    function visibilityHandlerWps(){
        if(document.hidden){
            switched = true;
            clearTimeout(timer);
            document.removeEventListener("visibilitychange", visibilityHandlerWps);
        }
    }
    document.addEventListener("visibilitychange", visibilityHandlerWps);
    window.location.href = "wps://";
}

/* 粒子动画 + 鼠标跟随反光变量注入 */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let w, h;
let particles = [];
let mouse = { x: 0, y: 0 };

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

class Particle{
  constructor(x, y, type = "move"){
    this.x = x;
    this.y = y;
    this.size = type === "click" ? Math.random() * 6 + 4 : Math.random() * 3 + 2;
    this.speedX = (Math.random() - 0.5) * (type === "click" ? 6 : 2);
    this.speedY = (Math.random() - 0.5) * (type === "click" ? 6 : 2);
    this.life = 1;
    this.decay = type === "click" ? 0.018 : 0.008;
    this.color = type === "click"
      ? `rgba(80, 90, 110, ${Math.random() * 0.35 + 0.18})`
      : `rgba(120, 130, 150, ${Math.random() * 0.25 + 0.1})`;
  }
  update(){
    this.x += this.speedX;
    this.y += this.speedY;
    this.life -= this.decay;
    this.size *= 0.97;
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function spawn(x, y, type = "move"){
  const count = type === "click" ? 12 : 3;
  for(let i = 0; i < count; i++){
    particles.push(new Particle(x, y, type));
  }
}

window.addEventListener("mousemove", e=>{
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  spawn(mouse.x, mouse.y, "move");

  document.querySelectorAll(".card-box, .card").forEach(el=>{
    const rect = el.getBoundingClientRect();
    const x = ((mouse.x - rect.left) / rect.width) * 100;
    const y = ((mouse.y - rect.top) / rect.height) * 100;
    el.style.setProperty("--x", `${x}%`);
    el.style.setProperty("--y", `${y}%`);
  });
});

window.addEventListener("mousedown", e=>{
  for(let i = 0; i < 3; i++){
    setTimeout(()=> spawn(e.clientX, e.clientY, "click"), i * 16);
  }
});

function animate(){
  ctx.clearRect(0, 0, w, h);
  particles = particles.filter(p=> p.life > 0 && p.size > 0.5);
  particles.forEach(p=>{
    p.update();
    p.draw();
  });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
