<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>公开留言板</title>
<style>
*{box-sizing:border-box}
body{max-width:900px;margin:2rem auto;padding:0 1rem;font-family:system-ui}
.msg-item{border:1px solid #ddd;padding:14px;border-radius:8px;margin:10px 0}
.name{font-weight:bold;margin-bottom:6px}
textarea,input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
button{padding:8px 16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<h2>公开留言板</h2>
<div id="form-box">
<input type="text" id="username" placeholder="昵称（选填）">
<textarea id="msg" rows="4" placeholder="输入留言内容"></textarea>
<button onclick="sendMsg()">提交留言</button>
</div>
<hr>
<div id="board"></div>

<script>
const WORKER_URL = "https://msg-api.1377400396.workers.dev";

async function loadList(){
  try{
    const res = await fetch(`${WORKER_URL}/list`);
    const list = await res.json();
    const dom = document.getElementById("board");
    dom.innerHTML = "";
    list.forEach(item=>{
      const div = document.createElement("div");
      div.className="msg-item";
      div.innerHTML = `
        <div class="name">${item.title}</div>
        <div>${item.body}</div>
      `;
      dom.appendChild(div);
    })
  }catch(err){
    console.error("加载留言失败",err);
  }
}

async function sendMsg(){
  const name = document.getElementById("username").value.trim() || "匿名访客";
  const content = document.getElementById("msg").value.trim();
  if(!content) return alert("请输入留言");

  // 【关键】浏览器本地生成东八区时间，不再依靠服务器
  const localTime = new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});

  try{
    await fetch(`${WORKER_URL}/submit`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,content,submitTime:localTime})
    })
    alert("提交成功，刷新查看！");
    document.getElementById("msg").value = "";
    loadList();
  }catch(err){
    alert("提交失败，请稍后重试！");
    console.error(err);
  }
}

window.onload = loadList;
</script>
</body>
</html>
